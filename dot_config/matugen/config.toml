# [config.wallpaper]
# command = "swww"
# arguments = ["img", "--transition-type", "random"]
# set = true

[config.custom_keywords]
candy_font = "Pacifico"
prog_font = "FiraCode Nerd Font"

[templates.niri]
input_path = "./templates/niri_colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.ironbar]
input_path = "./templates/colors.css"
output_path = "~/.config/ironbar/colors.css"
post_hook = "ironbar style load-css ~/.config/ironbar/colors.css"

[templates.rofi]
input_path = "./templates/matugen-rofi.rasi"
output_path = "~/.config/rofi/matugen/matugen-rofi.rasi"

[templates.kitty]
input_path = '~/.config/matugen/templates/matugen_kitty.conf'
output_path = '~/.config/kitty/matugen/colors-matugen.conf'
post_hook = "pkill -USR1 -x kitty"

# Gtk3
[templates.gtk3]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

# Gtk4
[templates.gtk4]
input_path = '~/.config/matugen/templates/matugen-gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.swaync]
input_path = './templates/swaync_style.css'
output_path = '~/.config/swaync/style.css'
post_hook = "swaync-client -rs"

[templates.anyrun]
input_path = './templates/matugen-anyrun.css'
output_path = '~/.config/anyrun/style.css'

# Firefox (pywalfox reads ~/.cache/wal/colors.json)
[templates.pywalfox]
input_path = './templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = "/var/home/bleroux/.local/bin/pywalfox update"
