# Built-in sink and source both show up as "Ryzen HD Audio Controller Analog Stereo"
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_09_00.6.analog-stereo" } ]
    actions = { update-props = { node.description = "Haut-parleurs" } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_09_00.6.analog-stereo" } ]
    actions = { update-props = { node.description = "Micro" } }
  }
]

# Sony WH-1000XM5 headset: sink and source are both "WH-1000XM5"
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.58_18_62_35_B1_03.*" } ]
    actions = { update-props = { node.description = "Casque" } }
  }
  # The mic is a loopback node created by WirePlumber's bluez scripts: no rule can
  # match it, it always copies the device description, so rename the device itself
  {
    matches = [ { device.name = "bluez_card.58_18_62_35_B1_03" } ]
    actions = { update-props = { device.description = "Casque (micro)" } }
  }
]
